      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommissionerInviteInput'
      responses:
        '200':
          description: Updated invite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionerInvite'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No active invite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags: [Leagues]
      operationId: revokeCommissionerInvite
      summary: Revoke the active commissioner invite (commissioner only)
      responses:
        '204':
          description: Revoked.
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No active invite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /leagues/{leagueId}/commissioner-invite/rotate:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
    post:
      tags: [Leagues]
      operationId: rotateCommissionerInvite
      summary: Rotate the commissioner invite — revoke old, issue new (commissioner only)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommissionerInviteInput'
      responses:
        '200':
          description: New invite issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionerInvite'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /leagues/{leagueId}/public-code:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
    patch:
      tags: [Leagues]
      operationId: setPublicCode
      summary: Set or update the league public code (commissioner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPublicCodeInput'
      responses:
        '200':
          description: Public code updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCodeResult'
        '400':
          description: Invalid format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Public code already taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /j/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
        description: League public code (case-insensitive, e.g. RUSTBELT)
    get:
      tags: [Discovery]
      operationId: resolvePublicCode
      summary: Resolve a league public code to its slug (no auth required)
      responses:
        '200':
          description: League slug resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCodeLookup'
        '404':
          description: No league with that public code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /join/{token}:
    parameters:
      - $ref: '#/components/parameters/CommissionerInviteToken'
    get:
      tags: [Seats]
      operationId: getCommissionerInvitePublic
      summary: Public landing page data for a commissioner invite link
      responses:
        '200':
          description: Invite info and usability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionerInvitePublic'
        '410':
          description: Invite no longer active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /join/{token}/claim:
    parameters:
      - $ref: '#/components/parameters/CommissionerInviteToken'
    post:
      tags: [Seats]
      operationId: claimCommissionerInvite
      summary: Claim a seat via commissioner invite (authenticated)
      responses:
        '200':
          description: Claim recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimOutcome'
        '409':
          description: Already claimed this invite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: Invite no longer active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  # ------------------------------------------------------------------ Availability

  /leagues/{leagueId}/availability:
    put:
      tags: [Availability]
      operationId: setAvailability
      summary: Set my availability grid for a league
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAvailabilityBody'
      responses:
        '200':
          description: Availability saved.

  /leagues/{leagueId}/availability/me:
    get:
      tags: [Availability]
      operationId: getMyAvailability
      summary: Get my availability grid for a league
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Availability record.

  /games/{gameId}/overlap:
    get:
      tags: [Availability]
      operationId: getGameOverlap
      summary: Get overlapping availability for a game's two GMs
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Overlap computation result.

  /leagues/{leagueId}/dq-findings:
    get:
      operationId: listDqFindings
      summary: List data-quality findings for a league (commissioner only)
      tags: [DQ]
      parameters:
        - $ref: '#/components/parameters/LeagueId'
        - name: severity
          in: query
          required: false
          schema:
            type: string
            enum: [BLOCK, ALERT, WATCH]
        - name: resolved
          in: query
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Paginated list of DQ findings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DqFindingsEnvelope'
        '403':
          description: Not the league commissioner.
        '404':
          description: League not found.

  /leagues/{leagueId}/dq-findings/{findingId}/resolve:
    patch:
      operationId: resolveDqFinding
      summary: Mark a DQ finding as resolved (commissioner only)
      tags: [DQ]
      parameters:
        - $ref: '#/components/parameters/LeagueId'
        - name: findingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Finding marked resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DqFinding'
        '403':
          description: Not the league commissioner.
        '404':
          description: Finding not found.

  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: List the authenticated user's durable in-app inbox
      security:
        - sessionCookie: []
      parameters:
        - name: unread_only
          in: query
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Inbox items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
        '401': { description: Not authenticated }

  /notifications/{notificationId}/read:
    patch:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Mark an inbox item read
      security:
        - sessionCookie: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated inbox item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '404': { description: Notification not found }

  /notification-preferences:
    get:
      tags: [Notifications]
      operationId: getNotificationPreferences
      summary: Get per-event notification preferences
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferenceList'
    put:
      tags: [Notifications]
      operationId: updateNotificationPreferences
      summary: Replace one or more per-event notification preferences
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferenceInput'
      responses:
        '200':
          description: Preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferenceList'
        '400': { description: Invalid preferences }

  /leagues/{leagueId}/announcements:
    post:
      tags: [Notifications]
      operationId: createAnnouncement
      summary: Publish a commissioner announcement through the notification dispatcher
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/LeagueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementInput'
      responses:
        '202':
          description: Announcement queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementReceipt'
        '403': { description: Commissioner access required }

  /leagues/{leagueId}/discord-webhooks:
    get:
      tags: [Notifications]
      operationId: listDiscordWebhooks
      summary: List masked Discord webhook configurations
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/LeagueId'
      responses:
        '200':
          description: Masked webhook configurations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscordWebhookList'
    post:
      tags: [Notifications]
      operationId: createDiscordWebhook
      summary: Add an encrypted Discord webhook (maximum five per league)
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/LeagueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscordWebhookInput'
      responses:
        '201':
          description: Created masked webhook configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscordWebhook'
        '409': { description: Webhook limit reached }

  /leagues/{leagueId}/discord-webhooks/{webhookId}:
    patch:
      tags: [Notifications]
      operationId: updateDiscordWebhook
      summary: Update a Discord webhook configuration
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/LeagueId'
        - name: webhookId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscordWebhookUpdate'
      responses:
        '200':
          description: Updated masked webhook configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscordWebhook'
        '404': { description: Webhook not found }
    delete:
      tags: [Notifications]
      operationId: deleteDiscordWebhook
      summary: Delete a Discord webhook configuration
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/LeagueId'
        - name: webhookId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Deleted }
        '404': { description: Webhook not found }

  /leagues/{leagueId}/discord-webhooks/{webhookId}/test:
    post:
      tags: [Notifications]
      operationId: testDiscordWebhook
      summary: Queue a test message through the common dispatcher
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/LeagueId'
        - name: webhookId
          in: path
          required: true
          schema: { type: string }
      responses:
        '202':
          description: Test queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementReceipt'

components:

  parameters:
    IdentityVerificationChallengeId:
      name: challengeId
      in: path
      required: true
      schema: { type: string }
    LeagueId:
      name: leagueId
      in: path
      required: true
      schema:
        type: string
    SeasonId:
      name: seasonId
      in: path
      required: true
      schema:
        type: string
    GameId:
      name: gameId
      in: path
      required: true
      schema:
        type: string
    ResultId:
      name: resultId
      in: path
      required: true
      schema:
        type: string
    TeamSeasonId:
      name: teamSeasonId
      in: path
      required: true
      schema:
        type: string
    InviteToken:
      name: token
      in: path
      required: true
      schema:
        type: string
    CommissionerInviteToken:
      name: token
      in: path
      required: true
      schema:
        type: string
    JoinRequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 255
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
  schemas:
    Notification:
      type: object
      required: [id, event_type, title, body, created_at]
      properties:
        id: { type: string }
        league_id: { type: [string, 'null'] }
        event_type: { type: string }
        title: { type: string }
        body: { type: string }
        data: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        read_at: { type: [string, 'null'], format: date-time }
    NotificationList:
      type: object
      required: [data, unread_count]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        unread_count: { type: integer }
    NotificationPreference:
      type: object
      required: [event_type, in_app, email, daily_digest]
      properties:
        event_type: { type: string, minLength: 1, maxLength: 100 }
        in_app: { type: boolean }
        email: { type: boolean }
        daily_digest: { type: boolean }
    NotificationPreferenceInput:
      type: object
      required: [preferences]
      properties:
        preferences:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/NotificationPreference' }
    NotificationPreferenceList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/NotificationPreference' }
    AnnouncementInput:
      type: object
      required: [title, body]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        body: { type: string, minLength: 1, maxLength: 4000 }
    AnnouncementReceipt:
      type: object
      required: [event_id, queued]
      properties:
        event_id: { type: string }
        queued: { type: boolean }
    DiscordWebhookInput:
      type: object
      required: [name, url, event_filters]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        url: { type: string, maxLength: 2048 }
        event_filters:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/DiscordEventFilter' }
    DiscordWebhook:
      type: object
      required: [id, name, masked_url, event_filters, enabled, failure_count, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        masked_url: { type: string }
        event_filters:
          type: array
          items: { $ref: '#/components/schemas/DiscordEventFilter' }
        enabled: { type: boolean }
        failure_count: { type: integer }
        disabled_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    DiscordWebhookUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        url: { type: string, maxLength: 2048 }
        event_filters:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/DiscordEventFilter' }
        enabled: { type: boolean }
    DiscordEventFilter:
      type: string
      enum:
        - commissioner.announcement
        - discord.test
        - result.reported
        - result.confirmed
        - result.disputed
        - schedule.generated
        - schedule.window_shifted
        - schedule.game_postponed
        - schedule.game_resolved
        - trade.proposed
        - trade.executed
        - signing
        - waiver.claim
    DiscordWebhookList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/DiscordWebhook' }

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, trace_id]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: ["string", "null"]
        instance:
          type: ["string", "null"]
        trace_id:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ProblemError'

    ProblemError:
      type: object
      properties:
        pointer:
          type: string
        message:
          type: string

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    # ------------------------------------------------------------------ Domain

    League:
      type: object
      required: [id, slug, name, visibility]
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        visibility:
          type: string
          enum: [public, unlisted, private]
        logo_url:
          type: ["string", "null"]
        primary_color:
          type: ["string", "null"]
        secondary_color:
          type: ["string", "null"]
        owner_user_id:
          type: string
        created_at:
          type: string
          format: date-time

    CreateLeagueInput:
      type: object
      required: [name, slug, settings]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          minLength: 2
          maxLength: 40
          pattern: '^[a-z0-9][a-z0-9-]*[a-z0-9]$'
        visibility:
          type: string
          enum: [public, unlisted, private]
          default: public
        primary_color:
          type: ["string", "null"]
        secondary_color:
          type: ["string", "null"]
        logo_url:
          type: ["string", "null"]
        settings:
          $ref: '#/components/schemas/LeagueSettingsInput'

    UpdateLeagueInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        visibility:
          type: string
          enum: [public, unlisted, private]
        primary_color:
          type: ["string", "null"]
        secondary_color:
          type: ["string", "null"]
        logo_url:
          type: ["string", "null"]

    LeagueSettingsInput:
      type: object
      additionalProperties: false
      required:
        - platform
        - team_count
        - roster_source
        - schedule_format
        - schedule_settings
        - playoff_format
        - divisions
        - conferences
        - slider_presets
        - require_verified_identities
        - points_win
        - points_ot_loss
        - points_reg_loss
        - tiebreakers
        - use_league_defaults
        - change_summary
      properties:
        applied_template_id:
          type: ["string", "null"]
          enum: [balanced_standard, international_style, maximum_fighting_contact, null]
          description: Curated template explicitly applied before this version was saved.
        ea_league_id:
          type: ["string", "null"]
          maxLength: 100
        platform:
          type: string
          enum: [psn, xbox, both]
        team_count:
          type: integer
          minimum: 3
          maximum: 32
        roster_source:
          type: string
          enum: [manual, ea, csv_import]
        schedule_format:
          type: string
          enum: [round_robin, double_round_robin, custom]
        schedule_settings:
          type: object
          additionalProperties: true
        playoff_format:
          type: object
          additionalProperties: true
        salary_cap_cents:
          type: ["integer", "null"]
          minimum: 0
        roster_min:
          type: ["integer", "null"]
          minimum: 1
        roster_max:
          type: ["integer", "null"]
          minimum: 1
        divisions:
          type: array
          items:
            type: string
        conferences:
          type: array
          items:
            type: string
        rules_notes:
          type: ["string", "null"]
        slider_presets:
          type: object
          additionalProperties: true
        require_verified_identities:
          type: boolean
          default: false
          description: Require the selected saved console identity to be currently verified for signup and waitlist eligibility.
        points_win:
          type: integer
          minimum: 0
        points_ot_loss:
          type: integer
          minimum: 0
        points_reg_loss:
          type: integer
          minimum: 0
        tiebreakers:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        use_league_defaults:
          type: boolean
          default: true
        apply_to_active_season:
          type: boolean
          default: false
        change_summary:
          type: string
          minLength: 1
          maxLength: 500

    LeagueSettingsTemplateValues:
      type: object
      additionalProperties: false
      required:
        - platform
        - team_count
        - roster_source
        - schedule_format
        - schedule_settings
        - playoff_format
        - salary_cap_cents
        - roster_min
        - roster_max
        - divisions
        - conferences
        - rules_notes
        - slider_presets
        - require_verified_identities
        - points_win
        - points_ot_loss
        - points_reg_loss
        - tiebreakers
        - use_league_defaults
      properties:
        platform:
          type: string
          enum: [psn, xbox, both]
        team_count:
          type: integer
          minimum: 3
          maximum: 32
        roster_source:
          type: string
          enum: [manual, ea, csv_import]
        schedule_format:
          type: string
          enum: [round_robin, double_round_robin, custom]
        schedule_settings:
          type: object
          additionalProperties: true
        playoff_format:
          type: object
          additionalProperties: true
        salary_cap_cents:
          type: ["integer", "null"]
          minimum: 0
        roster_min:
          type: ["integer", "null"]
          minimum: 1
        roster_max:
          type: ["integer", "null"]
          minimum: 1
        divisions:
          type: array
          items:
            type: string
        conferences:
          type: array
          items:
            type: string
        rules_notes:
          type: ["string", "null"]
        slider_presets:
          type: object
          additionalProperties: true
        require_verified_identities:
          type: boolean
        points_win:
          type: integer
          minimum: 0
        points_ot_loss:
          type: integer
          minimum: 0
        points_reg_loss:
          type: integer
          minimum: 0
        tiebreakers:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        use_league_defaults:
          type: boolean

    LeagueSettingsTemplate:
      type: object
      additionalProperties: false
      required: [id, name, description, differences, values]
      properties:
        id:
          type: string
          enum: [balanced_standard, international_style, maximum_fighting_contact]
        name:
          type: string
        description:
          type: string
        differences:
          type: array
          items:
            type: string
        values:
          $ref: '#/components/schemas/LeagueSettingsTemplateValues'

    LeagueSettingsTemplateList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LeagueSettingsTemplate'

    LeagueSettingsVersion:
      allOf:
        - $ref: '#/components/schemas/LeagueSettingsInput'
        - type: object
          required: [id, league_id, version, changed_by, changed_at, is_active, can_manage]
          properties:
            id:
              type: string
            league_id:
              type: string
            version:
              type: integer
            changed_by:
              type: string
            changed_at:
              type: string
              format: date-time
            is_active:
              type: boolean
            can_manage:
              type: boolean

    LeagueSettingsHistory:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LeagueSettingsVersion'

    NoLeagueSettings:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: "null"

    CreateSeasonInput:
      type: object
      required: [label, game_title]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
        game_title:
          type: string
          minLength: 1
          maxLength: 50
        starts_on:
          type: ["string", "null"]
          format: date
        ends_on:
          type: ["string", "null"]
          format: date
        salary_cap_cents:
          type: ["integer", "null"]
          minimum: 0
        roster_min:
          type: ["integer", "null"]
          minimum: 1
        roster_max:
          type: ["integer", "null"]
          minimum: 1
        games_per_matchup:
          type: integer
          minimum: 1
          maximum: 8
        points_win:
          type: integer
          minimum: 0
        points_ot_loss:
          type: integer
          minimum: 0
        points_reg_loss:
          type: integer
          minimum: 0
        tiebreakers:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string

    LeagueHub:
      type: object
      description: Summary stats for the league hub slab.
      required: [league_id, active_season_id]
      properties:
        league_id:
          type: string
        active_season_id:
          type: ["string", "null"]
        active_season_label:
          type: ["string", "null"]
        games_scheduled:
          type: integer
        games_confirmed:
          type: integer
        games_on_time_pct:
          type: ["number", "null"]
        open_seats:
          type: integer
        active_gms:
          type: integer
        my_games_this_week:
          type: array
          items:
            $ref: '#/components/schemas/Game'
        recent_notifications:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        unread_notification_count:
          type: integer
          minimum: 0
        applicant_activity:
          type: array
          items:
            $ref: '#/components/schemas/HubApplicantActivity'
        wire_transactions:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        open_seat_details:
          type: array
          items:
            $ref: '#/components/schemas/OpenSeatDetail'

    Transaction:
      type: object
      required: [id, season_id, type, status, proposed_at, assets, summary, provenance, cap_checked]
      properties:
        id: { type: string }
        season_id: { type: string }
        type: { $ref: '#/components/schemas/TransactionType' }
        status: { $ref: '#/components/schemas/TransactionStatus' }
        proposed_by: { type: [string, 'null'] }
        proposed_at: { type: string, format: date-time }
        resolved_at: { type: [string, 'null'], format: date-time }
        reverses_txn_id: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        assets:
          type: array
          items: { $ref: '#/components/schemas/TransactionAsset' }
        summary: { type: string }
        provenance: { type: string, enum: [manual, commissioner] }
        cap_checked: { type: boolean }
        approved_by:
          type: [string, 'null']
          description: Commissioner app-user ID from the recorded approval, if approved.
    TransactionList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }
    TransactionType:
      type: string
      # Includes all persisted txn_type values. ir_move and seat_change remain
      # public legacy aliases for rows created before their canonical mappings.
      enum: [trade, signing, release, waiver_claim, call_up, send_down, ir_place, ir_activate, retire, draft_pick, reversal, ir_move, seat_change]
    TransactionStatus:
      type: string
      enum: [proposed, accepted, pending_approval, approved, rejected, executed, reversed, withdrawn]
    TransactionAsset:
      type: object
      required: [kind, from_team_season_id, to_team_season_id]
      properties:
        kind: { type: string, enum: [player, draft_pick, cap_space, retained_salary] }
        player_id: { type: [string, 'null'] }
        draft_year: { type: [integer, 'null'] }
        draft_round: { type: [integer, 'null'] }
        amount_cents: { type: [integer, 'null'], format: int64 }
        from_team_season_id: { type: [string, 'null'] }
        to_team_season_id: { type: [string, 'null'] }
    CreateTransactionInput:
      type: object
      required: [season_id, type, assets]
      properties:
        season_id: { type: string }
        # Only movement types with defined execution semantics are creatable.
        # TransactionType remains broader so historical ledger rows are readable.
        type: { type: string, enum: [trade, signing, release, waiver_claim] }
        assets:
          type: array
          items: { $ref: '#/components/schemas/TransactionAsset' }
        note: { type: string, maxLength: 2000 }
        entry_source: { type: string, enum: [manual, commissioner], default: manual }
    TransactionRationaleInput:
      type: object
      properties:
        rationale: { type: string, maxLength: 2000 }
    OpenSeatDetail:
      type: object
      required: [team_season_id, franchise_id, state, applicant_count]
      properties:
        team_season_id: { type: string }
        franchise_id: { type: string }
        franchise_name: { type: string }
        state: { type: string, enum: [vacated, never_filled, inactive] }
        applicant_count: { type: integer, minimum: 0 }

    ApplicantSeatOption:
      type: object
      required: [team_season_id, franchise_id, franchise_name]
      properties:
        team_season_id: { type: string }
        franchise_id: { type: string }
        franchise_name: { type: string }
        club_abbrev: { type: [string, 'null'] }
        club_name: { type: [string, 'null'] }

    ApplicantSeatPreference:
      type: object
      required: [team_season_id, franchise_name]
      properties:
        team_season_id: { type: string }
        franchise_name: { type: string }
        club_abbrev: { type: [string, 'null'] }
        club_name: { type: [string, 'null'] }

    HubApplicantActivity:
      type: object
      required: [source, id, user_id, status, created_at]
      properties:
        source:
          type: string
          enum: [signup, waitlist, invite_request]
        id:
          type: string
        user_id:
          type: string
        display_name:
          type: [string, 'null']
        status:
          type: string
        created_at:
          type: string
          format: date-time

    PublicLeagueEnvelope:
      type: object
      required: [league, standings]
      properties:
        league:
          type: object
          required: [id, slug, name, visibility]
          properties:
            id:
              type: string
            slug:
              type: string
            name:
              type: string
            visibility:
              type: string
            public_code:
              type: string
              nullable: true
        season:
          oneOf:
            - type: object
              required: [id, label]
              properties:
                id:
                  type: string
                label:
                  type: string
            - type: 'null'
        standings:
          type: array
          items:
            $ref: '#/components/schemas/StandingsRow'
        listing:
          description: >
            Present when the league has an active listing entry (is_listed = true).
            Null when the league is not publicly recruiting.
          oneOf:
            - type: object
              required: [is_listed, accepting_signups, accepting_waitlist]
              properties:
                is_listed:
                  type: boolean
                accepting_signups:
                  type: boolean
                accepting_waitlist:
                  type: boolean
                blurb:
                  type: ["string", "null"]
                platform:
                  type: ["string", "null"]
                competitiveness:
                  type: ["string", "null"]
                suggested_division:
                  type: ["string", "null"]
            - type: 'null'

    Season:
      type: object
      required: [id, ordinal, label, game_title]
      properties:
        id:
          type: string
        league_id:
          type: string
        settings_version_id:
          type: ["string", "null"]
          description: Immutable league settings version bound to this season.
        ordinal:
          type: integer
          minimum: 1
        label:
          type: string
        game_title:
          type: string
        starts_on:
          type: ["string", "null"]
        ends_on:
          type: ["string", "null"]
        salary_cap_cents:
          type: ["integer", "null"]
        roster_min:
          type: ["integer", "null"]
        roster_max:
          type: ["integer", "null"]
        games_per_matchup:
          type: integer
        points_win:
          type: integer
        points_ot_loss:
          type: integer
        points_reg_loss:
          type: integer
        tiebreakers:
          type: array
          items:
            type: string
        is_active:
          type: boolean

    # ------------------------------------------------------------------ Seats

    InviteLink:
      type: object
      required: [id, token, league_id, created_at]
      properties:
        id:
          type: string
        token:
          type: string
        league_id:
          type: string
        max_uses:
          type: ["integer", "null"]
        use_count:
          type: integer
        expires_at:
          type: ["string", "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: ["string", "null"]
          format: date-time
        league_name:
          type: ["string", "null"]

    CreateInviteInput:
      type: object
      properties:
        max_uses:
          type: ["integer", "null"]
          minimum: 1
        expires_in_hours:
          type: ["integer", "null"]
          minimum: 1

    JoinRequest:
      type: object
      required: [id, league_id, status, created_at]
      properties:
        id:
          type: string
        league_id:
          type: string
        user_id:
          type: string
        display_name:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, approved, rejected]
        reviewed_by:
          type: ["string", "null"]
        reviewed_at:
          type: ["string", "null"]
          format: date-time
        note:
          type: ["string", "null"]
        created_at:
          type: string
          format: date-time

    Seat:
      type: object
      required: [team_season_id, franchise_id, seat_status]
      properties:
        team_season_id:
          type: string
        franchise_id:
          type: string
        franchise_name:
          type: string
        nhl_club_id:
          type: ["string", "null"]
        club_abbrev:
          type: ["string", "null"]
        club_name:
          type: ["string", "null"]
        conference:
          type: ["string", "null"]
        division:
          type: ["string", "null"]
        seat_status:
          type: string
          enum: [open, pending, filled, suspended, vacated]
        gm:
          oneOf:
            - $ref: '#/components/schemas/AssignedGm'
            - type: 'null'

    AssignedGm:
      type: object
      required: [assignment_id, user_id]
      properties:
        assignment_id:
          type: string
        user_id:
          type: string
        display_name:
          type: ["string", "null"]
        gm_platform:
          oneOf:
            - $ref: '#/components/schemas/PlayerSystem'
            - type: 'null'
        gm_primary_identity:
          oneOf:
            - $ref: '#/components/schemas/PlayerSystem'
            - type: 'null'
        gm_gamertag:
          type: ["string", "null"]
        gm_xbox_gamertag:
          type: ["string", "null"]
        gm_psn_online_id:
          type: ["string", "null"]
        gm_identity_verified:
          type: boolean
        started_at:
          type: string
          format: date-time
        role:
          type: string

    AssignGmInput:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
        role:
          type: string
          enum: [gm, assistant_commissioner]
          default: gm
        end_reason:
          type: ["string", "null"]
          description: Reason for closing the previous GM assignment (if any).

    # ------------------------------------------------------------------ Rulebook

    RulebookRevision:
      type: object
      required: [id, league_id, version, body_md, authored_by, effective_at]
      properties:
        id:
          type: string
        league_id:
          type: string
        version:
          type: string
        body_md:
          type: string
        change_note:
          type: ["string", "null"]
        authored_by:
          type: string
        effective_at:
          type: string
          format: date-time

    PublishRulebookInput:
      type: object
      required: [body_md]
      properties:
        body_md:
          type: string
          minLength: 1
        change_note:
          type: ["string", "null"]
          maxLength: 500

    # ------------------------------------------------------------------ Competition

    GameStatus:
      type: string
      enum: [scheduled, in_window, reported, confirmed, disputed, forfeited, postponed, simulated, voided]

    GameSide:
      type: object
      required: [team_season_id, franchise_id]
      properties:
        team_season_id:
          type: string
        franchise_id:
          type: string
        franchise_name:
          type: ["string", "null"]
        club_abbrev:
          type: ["string", "null"]
        goals:
          type: ["integer", "null"]
          minimum: 0
        gm_display_name:
          type: ["string", "null"]
        gm_platform:
          oneOf:
            - $ref: '#/components/schemas/PlayerSystem'
            - type: 'null'
        gm_primary_identity:
          oneOf:
            - $ref: '#/components/schemas/PlayerSystem'
            - type: 'null'
        gm_gamertag:
          type: ["string", "null"]
        gm_xbox_gamertag:
          type: ["string", "null"]
        gm_psn_online_id:
          type: ["string", "null"]
        gm_identity_verified:
          type: boolean

    Game:
      type: object
      required: [id, season_id, status, home, away]
      properties:
        id:
          type: string
        season_id:
          type: string
        week_number:
          type: ["integer", "null"]
        status:
          $ref: '#/components/schemas/GameStatus'
        window_opens_at:
          type: string
          format: date-time
        window_closes_at:
          type: string
          format: date-time
        played_at:
          type: ["string", "null"]
          format: date-time
        home:
          $ref: '#/components/schemas/GameSide'
        away:
          $ref: '#/components/schemas/GameSide'
        result:
          oneOf:
            - $ref: '#/components/schemas/GameResult'
            - type: 'null'

    GameResult:
      type: object
      required: [id, game_id, home_goals, away_goals, decision, version, data_source]
      properties:
        id:
          type: string
        game_id:
          type: string
        home_goals:
          type: integer
          minimum: 0
        away_goals:
          type: integer
          minimum: 0
        decision:
          type: string
          enum: [regulation, overtime, shootout]
        version:
          type: integer
          description: |
            Optimistic-concurrency token. Return as ETag; require If-Match on
            confirm/dispute/supersede. A stale value returns 409.
        data_source:
          type: string
          enum: [manual, confirmed, ocr, csv_import, partner_api, system]
        counts_toward_standings:
          type: boolean
        reported_by:
          type: ["string", "null"]
        verified_by:
          type: ["string", "null"]
        verified_at:
          type: ["string", "null"]
          format: date-time
        superseded_by:
          type: ["string", "null"]
        supersede_reason:
          type: ["string", "null"]
        created_at:
          type: string
          format: date-time

    ResultInput:
      type: object
      required: [home_goals, away_goals, decision]
      properties:
        home_goals:
          type: integer
          minimum: 0
        away_goals:
          type: integer
          minimum: 0
        decision:
          type: string
          enum: [regulation, overtime, shootout]
        supersede_result_id:
          type: ["string", "null"]
        supersede_reason:
          type: ["string", "null"]
          maxLength: 500

    ConfirmInput:
      type: object
      required: [agree]
      properties:
        agree:
          type: boolean
        dispute_reason:
          type: ["string", "null"]
          maxLength: 500

    # ------------------------------------------------------------------ Schedule

    GenerateScheduleBody:
      type: object
      properties:
        week_duration_days:
          type: integer
          minimum: 1
          maximum: 30
          default: 7
        start_date:
          type: string
          format: date

    GenerateScheduleResult:
      type: object
      required: [games_created, total_weeks, total_rounds]
      properties:
        games_created:
          type: integer
        total_weeks:
          type: integer
        total_rounds:
          type: integer
        season_start:
          type: string
          format: date-time
        week_duration_days:
          type: integer

    WeekStatus:
      type: object
      required: [total, scheduled, in_window, reported, confirmed, disputed, forfeited, postponed, voided]
      properties:
        total:      { type: integer }
        scheduled:  { type: integer }
        in_window:  { type: integer }
        reported:   { type: integer }
        confirmed:  { type: integer }
        disputed:   { type: integer }
        forfeited:  { type: integer }
        postponed:  { type: integer }
        voided:     { type: integer }

    WeekWindow:
      type: object
      required: [week_number, window_opens_at, window_closes_at, games]
      properties:
        week_number:
          type: integer
        window_opens_at:
          type: string
          format: date-time
        window_closes_at:
          type: string
          format: date-time
        games:
          $ref: '#/components/schemas/WeekStatus'

    WeekListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WeekWindow'

    ShiftWindowBody:
      type: object
      required: [window_opens_at, window_closes_at, reason]
      properties:
        window_opens_at:
          type: string
          format: date-time
        window_closes_at:
          type: string
          format: date-time
        reason:
          type: string
          minLength: 1
          maxLength: 500

    PostponeGameBody:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500

    ForceResolveGameBody:
      type: object
      required: [resolution, reason]
      properties:
        resolution:
          type: string
          enum: [forfeit_home, forfeit_away, void]
        reason:
          type: string
          minLength: 1
          maxLength: 500

    # ------------------------------------------------------------------ Availability

    CommissionerInvite:
      type: object
      required: [id, league_id, token, created_by, uses, is_active, created_at]
      properties:
        id:
          type: string
        league_id:
          type: string
        token:
          type: string
        created_by:
          type: string
        max_uses:
          type: ["integer", "null"]
          minimum: 1
        uses:
          type: integer
          minimum: 0
        expires_at:
          type: ["string", "null"]
          format: date-time
        is_active:
          type: boolean
        revoked_at:
          type: ["string", "null"]
          format: date-time
        created_at:
          type: string
          format: date-time

    CommissionerInviteEnvelope:
      type: object
      required: [public_code, invite]
      properties:
        public_code:
          type: ["string", "null"]
        invite:
          oneOf:
            - $ref: '#/components/schemas/CommissionerInvite'
            - type: 'null'

    CommissionerInviteInput:
      type: object
      properties:
        max_uses:
          type: ["integer", "null"]
          minimum: 1
        expires_at:
          type: ["string", "null"]
          format: date-time

    SetPublicCodeInput:
      type: object
      properties:
        public_code:
          type: ["string", "null"]
          minLength: 5
          maxLength: 12
          pattern: '^[A-Z0-9]{5,12}$'

    PublicCodeResult:
      type: object
      required: [public_code]
      properties:
        public_code:
          type: ["string", "null"]

    PublicCodeLookup:
      type: object
      required: [slug]
      properties:
        slug:
          type: string

    CommissionerInvitePublic:
      type: object
      required: [invite_id, token, league_id, league_name, usable]
      properties:
        invite_id:
          type: string
        token:
          type: string
        league_id:
          type: string
        league_name:
          type: string
        league_slug:
          type: string
        platform:
          type: ["string", "null"]
        usable:
          type: boolean
        reason:
          type: ["string", "null"]
        uses:
          type: integer
        max_uses:
          type: ["integer", "null"]
        expires_at:
          type: ["string", "null"]
          format: date-time

    ClaimOutcome:
      type: object
      required: [outcome, league_id, invite_id]
      properties:
        outcome:
          type: string
          enum: [member, waitlist]
        league_id:
          type: string
        invite_id:
          type: string

    AvailabilitySlot:
      type: object
      required: [dow, block]
      properties:
        dow:
          type: integer
          minimum: 0
          maximum: 6
          description: "0 = Sunday, 6 = Saturday"
        block:
          type: string
          enum: [morning, afternoon, evening, night]

    SetAvailabilityBody:
      type: object
      required: [timezone, slots]
      properties:
        timezone:
          type: string
          minLength: 1
          maxLength: 100
          description: IANA timezone string (e.g. America/New_York)
        slots:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilitySlot'
          maxItems: 56

    # ------------------------------------------------------------------ Discovery

    OpenLeague:
      type: object
      required: [league_id, name, accepting_signups, accepting_waitlist, max_seats, seats_filled, seats_open, waitlist_length]
      properties:
        league_id:
          type: string
        slug:
          type: ["string", "null"]
        name:
          type: string
        logo_url:
          type: ["string", "null"]
        blurb:
          type: ["string", "null"]
        platform:
          type: ["string", "null"]
        competitiveness:
          type: ["string", "null"]
        suggested_division:
          type: ["string", "null"]
        accepting_signups:
          type: boolean
        accepting_waitlist:
          type: boolean
        active_season_id:
          type: ["string", "null"]
        max_seats:
          type: integer
        seats_filled:
          type: integer
        seats_open:
          type: integer
        waitlist_length:
          type: integer
        games_confirmed:
          type: ["integer", "null"]
        active_gms:
          type: ["integer", "null"]
        open_seat_options:
          type: array
          items:
            $ref: '#/components/schemas/ApplicantSeatOption'

    LeagueSignupInput:
      type: object
      properties:
        team_season_ids:
          type: array
          uniqueItems: true
          items:
            type: string
        country_code:
          type: string
          minLength: 2
          maxLength: 2
          pattern: '^[A-Z]{2}$'
        location:
          type: string
          maxLength: 100
        stated_division:
          type: string
          enum: [bronze, silver, gold, diamond, platinum, elite, ultimate]
        message:
          type: string
          maxLength: 500
        preferred_club:
          type: string
          maxLength: 100

    ApplicantSeatPreferenceInput:
      type: object
      properties:
        team_season_ids:
          type: array
          uniqueItems: true
          items:
            type: string

    LeagueSignup:
      type: object
      required: [id, league_id, user_id, created_at]
      properties:
        id:
          type: string
        league_id:
          type: string
        user_id:
          type: string
        platform:
          type: ["string", "null"]
        platform_gamertag:
          type: ["string", "null"]
        identity_verified:
          type: boolean
        timezone:
          type: ["string", "null"]
        country_code:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        stated_division:
          type: ["string", "null"]
        message:
          type: ["string", "null"]
        preferred_club:
          type: ["string", "null"]
        team_season_ids:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time

    PlayerSystem:
      type: string
      enum: [xbox, playstation]

    UserProfile:
      type: object
      required:
        [id, display_name, timezone, xbox_gamertag, psn_online_id,
         systems_played, primary_identity, xbox_identity_verified_at,
         playstation_identity_verified_at]
      properties:
        id:
          type: string
        display_name:
          type: string
        timezone:
          type: string
        xbox_gamertag:
          type: ["string", "null"]
        psn_online_id:
          type: ["string", "null"]
        systems_played:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PlayerSystem'
        primary_identity:
          oneOf:
            - $ref: '#/components/schemas/PlayerSystem'
            - type: 'null'
        xbox_identity_verified_at:
          type: ["string", "null"]
          format: date-time
        playstation_identity_verified_at:
          type: ["string", "null"]
          format: date-time

    IdentityVerificationChallenge:
      type: object
      required: [challenge_id, platform, gamertag, code, expires_at, profile_url]
      properties:
        challenge_id:
          type: string
        platform:
          $ref: '#/components/schemas/PlayerSystem'
        gamertag:
          type: string
        code:
          type: string
          description: Short-lived code to place in the public console profile text.
        expires_at:
          type: string
          format: date-time
        profile_url:
          type: string
          description: Official public profile URL constructed by the server.

    IdentityVerificationSubmission:
      type: object
      required: [challenge_id, platform, submitted_at, expires_at, review_path, status]
      properties:
        challenge_id: { type: string }
        platform: { $ref: '#/components/schemas/PlayerSystem' }
        submitted_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        review_path:
          type: string
          description: Relative in-app path to share with an eligible commissioner.
        status: { type: string, enum: [pending_commissioner_review] }

    IdentityVerificationReview:
      type: object
      required: [challenge_id, display_name, platform, gamertag, code, profile_url, expires_at, status]
      properties:
        challenge_id: { type: string }
        display_name: { type: string }
        platform: { $ref: '#/components/schemas/PlayerSystem' }
        gamertag: { type: string }
        code: { type: string }
        profile_url: { type: string }
        expires_at: { type: string, format: date-time }
        submitted_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        superseded_at: { type: [string, 'null'], format: date-time }
        status: { type: string, enum: [pending_commissioner_review, commissioner_verified, not_submitted, superseded, expired] }

    IdentityVerificationApproval:
      type: object
      required: [challenge_id, status, profile]
      properties:
        challenge_id: { type: string }
        status: { type: string, enum: [commissioner_verified] }
        profile: { $ref: '#/components/schemas/UserProfile' }

    UserProfileUpdate:
      type: object
      minProperties: 1
