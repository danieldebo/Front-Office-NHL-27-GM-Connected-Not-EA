        user_id:
          type: string
        display_name:
          type: ['string', 'null']
        skill_division:
          type: ['string', 'null']
        country_code:
          type: ['string', 'null']
        location:
          type: ['string', 'null']
        timezone:
          type: ['string', 'null']
        platform:
          type: ['string', 'null']
        platform_gamertag:
          type: ['string', 'null']
        xbox_identity_verified_at:
          type: ['string', 'null']
          format: date-time
        playstation_identity_verified_at:
          type: ['string', 'null']
          format: date-time
        identity_verified:
          type: boolean
        xbox_gamertag:
          type: ['string', 'null']
        psn_online_id:
          type: ['string', 'null']
        systems_played:
          type: array
          items:
            $ref: '#/components/schemas/PlayerSystem'
        primary_identity:
          oneOf:
            - $ref: '#/components/schemas/PlayerSystem'
            - type: 'null'
        message:
          type: ['string', 'null']
        preferred_club:
          type: ['string', 'null']
        preferred_seats:
          type: array
          items:
            $ref: '#/components/schemas/ApplicantSeatPreference'
        created_at:
          type: string
          format: date-time
        waitlist_status:
          type: ['string', 'null']
        waitlist_position:
          type: ['integer', 'null']

    WaitlistApplicant:
      type: object
      required: [waitlist_entry_id, signup_id, league_id, position, status, user_id, joined_at]
      properties:
        waitlist_entry_id:
          type: string
        signup_id:
          type: ['string', 'null']
        league_id:
          type: string
        position:
          type: integer
        status:
          type: string
          enum: [waiting, invited, placed, declined, withdrawn, expired]
        user_id:
          type: string
        display_name:
          type: ['string', 'null']
        skill_division:
          type: ['string', 'null']
        country_code:
          type: ['string', 'null']
        location:
          type: ['string', 'null']
        timezone:
          type: ['string', 'null']
        platform:
          type: ['string', 'null']
        platform_gamertag:
          type: ['string', 'null']
        xbox_identity_verified_at:
          type: ['string', 'null']
          format: date-time
        playstation_identity_verified_at:
          type: ['string', 'null']
          format: date-time
        identity_verified:
