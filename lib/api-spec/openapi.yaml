    # ------------------------------------------------------------------ Competition (existing)

    StandingsRow:
      type: object
      description: Derived. There is no write path for this resource.
      required: [team_season_id, franchise_id, GP, W, L, OTL, PTS]
      properties:
        rank:
          type: integer
        team_season_id:
          type: string
        franchise_id:
          type: string
        franchise_name:
          type: ["string", "null"]
        club_abbrev:
          type: ["string", "null"]
        gm_display_name:
          type: ["string", "null"]
        gm_platform:
          oneOf:
            - $ref: '#/components/schemas/PlayerSystem'
            - type: 'null'
        gm_primary_identity:
          oneOf:
            - $ref: '#/components/schemas/PlayerSystem'
            - type: 'null'
        gm_gamertag:
          type: ["string", "null"]
        gm_xbox_gamertag:
          type: ["string", "null"]
        gm_psn_online_id:
          type: ["string", "null"]
        GP:
          type: integer
        W:
          type: integer
        L:
          type: integer
        OTL:
          type: integer
        PTS:
          type: integer
        ROW:
          type: integer
        GF:
          type: integer
        GA:
          type: integer
        DIFF:
          type: integer
        unconfirmed_games:
          type: integer
        provenance:
          type: string
          enum: [confirmed, manual, ocr, reconciled, dispute]
          description: |
            Worst provenance across this team's games this season.
            'dispute' = has at least one disputed game.
            'manual'  = has unconfirmed (reported) results pending.
            'ocr'     = all confirmed, some via screenshot/OCR parse.
            'reconciled' = all confirmed via partner data feed.
            'confirmed' = all confirmed by mutual GM agreement.
