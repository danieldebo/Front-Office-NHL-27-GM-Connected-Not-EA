      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 100
        timezone:
          type: string
          minLength: 1
          maxLength: 100
        xbox_gamertag:
          type: ["string", "null"]
          minLength: 1
          maxLength: 100
        psn_online_id:
          type: ["string", "null"]
          minLength: 1
          maxLength: 100
        systems_played:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PlayerSystem'
        primary_identity:
          oneOf:
            - $ref: '#/components/schemas/PlayerSystem'
            - type: 'null'

    WaitlistPositionInput:
      type: object
      required: [position]
      properties:
        position:
          type: integer
          minimum: 1
          description: 1-based target position in the waiting queue.

    DeclineApplicantInput:
      type: object
      properties:
        note:
          type: string
          maxLength: 500
          description: Optional note explaining why the applicant was declined.

    WaitlistEntry:
      type: object
      required: [id, league_id, user_id, status, position, joined_at]
      properties:
        id:
          type: string
        league_id:
          type: string
        user_id:
          type: string
        signup_id:
          type: ["string", "null"]
        status:
          type: string
          enum: [waiting, invited, placed, declined, withdrawn, expired]
        position:
          type: integer
        joined_at:
          type: string
          format: date-time
        already_joined:
          type: boolean
        team_season_ids:
          type: array
          items:
            type: string

    # ------------------------------------------------------------------ Discovery (commissioner)

    LeagueListing:
      type: object
      required: [league_id, is_listed, accepting_signups, accepting_waitlist]
      properties:
        league_id:
          type: string
        is_listed:
          type: boolean
        accepting_signups:
          type: boolean
        accepting_waitlist:
          type: boolean
        blurb:
          type: ['string', 'null']
        platform:
          type: ['string', 'null']
          enum: [psn, playstation, xbox, both, crossplay, null]
        competitiveness:
          type: ['string', 'null']
          enum: [casual, competitive, hardcore, null]
        suggested_division:
          type: ['string', 'null']
        timezone_focus:
          type: ['string', 'null']
        listed_at:
          type: ['string', 'null']
          format: date-time
        updated_at:
          type: ['string', 'null']
          format: date-time

    UpdateLeagueListingInput:
      type: object
