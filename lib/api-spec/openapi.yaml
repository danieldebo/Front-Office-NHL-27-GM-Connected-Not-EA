openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.3.0
  description: Front Office API — league management, results, standings, and scheduling.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Leagues
    description: League and season metadata.
  - name: Seats
    description: Seat management — invites, join requests, GM assignment.
  - name: Rulebook
    description: Versioned league bylaws.
  - name: Competition
    description: Schedule, results, and derived standings.
  - name: Schedule
    description: Season schedule generation and week-window management.
  - name: Availability
    description: Per-GM availability grids and overlap surfacing.
  - name: Discovery
    description: Open-league directory, sign-up, and waitlist intake.
  - name: Feedback
    description: Feature request inbox.
  - name: Users
    description: Authenticated player profile.
  - name: Notifications
    description: Durable inbox, notification preferences, announcements, and Discord delivery.
  - name: Transactions
    description: Append-only roster and trade ledger.

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users/me:
    get:
      tags: [Users]
      operationId: getMyProfile
      summary: Get the authenticated player's saved profile
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current player profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      tags: [Users]
      operationId: updateMyProfile
      summary: Update the authenticated player's saved profile
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdate'
      responses:
        '200':
          description: Updated player profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Invalid or inconsistent profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /users/me/identity-verifications/{platform}/challenge:
    parameters:
      - name: platform
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/PlayerSystem'
    post:
      tags: [Users]
      operationId: createIdentityVerificationChallenge
      summary: Create a short-lived public console profile challenge
      security:
        - sessionCookie: []
      responses:
        '201':
          description: Challenge created for the currently saved platform identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityVerificationChallenge'
        '400':
          description: No saved identity exists for this platform.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /users/me/identity-verifications/{platform}/complete:
    parameters:
      - name: platform
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/PlayerSystem'
    post:
      tags: [Users]
      operationId: completeIdentityVerification
      summary: Submit a challenge for commissioner review
      description: |
        The player marks a code placed in their official console profile as ready.
        The server never fetches provider pages or verifies the profile automatically.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Challenge submitted; share the returned relative review path with a commissioner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityVerificationSubmission'
        '400':
          description: Challenge is missing, expired, superseded, or was already submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /identity-verifications/review/{challengeId}:
    parameters:
      - $ref: '#/components/parameters/IdentityVerificationChallengeId'
    get:
      tags: [Users]
      operationId: getIdentityVerificationReview
      summary: Get a commissioner-attested identity review
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Review details. Only an owner of a non-deleted league other than the applicant may view it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityVerificationReview'
        '401': { description: Not authenticated. }
        '403': { description: Caller is not an eligible commissioner or is the applicant. }
        '404': { description: Challenge not found. }

  /identity-verifications/review/{challengeId}/approve:
    parameters:
      - $ref: '#/components/parameters/IdentityVerificationChallengeId'
    post:
      tags: [Users]
      operationId: approveIdentityVerificationReview
      summary: Attest that the exact code was seen on the official profile
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Commissioner attestation recorded and identity verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityVerificationApproval'
        '400': { description: "Challenge is not submitted, active, unexpired, or its saved identity changed." }
        '401': { description: Not authenticated. }
        '403': { description: Caller is not an eligible commissioner or is the applicant. }
        '404': { description: Challenge not found. }

  # ------------------------------------------------------------------ Discovery

  /leagues/open:
    get:
      tags: [Discovery]
      operationId: listOpenLeagues
      summary: Public list of recruiting leagues (no auth required)
      parameters:
        - name: platform
          in: query
          schema:
            type: string
            enum: [psn, xbox, both]
        - name: competitiveness
          in: query
          schema:
            type: string
            enum: [casual, competitive, hardcore]
        - name: seats_open
          in: query
          schema:
            type: string
            enum: ["true", "false"]
        - name: health_min
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Open leagues with seat and waitlist counts.
          content:
            application/json:
              schema:
                type: object
                required: [data, total]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OpenLeague'
                  total:
                    type: integer

  /leagues/{leagueId}/signup:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
    post:
      tags: [Discovery]
      operationId: signupForLeague
      summary: Sign up for an open seat (authenticated)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeagueSignupInput'
      responses:
        '201':
          description: Sign-up created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueSignup'
        '400':
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: League not found or not recruiting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Already signed up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /leagues/{leagueId}/waitlist:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
    get:
      tags: [Discovery]
      operationId: listLeagueWaitlist
      summary: List waitlist entries for a league (commissioner only)
      parameters:
        - name: seat
          in: query
          description: Return only waitlist entrants willing to take this team-season seat.
          schema:
            type: string
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Waitlist entries ordered by position.
          content:
            application/json:
              schema:
                type: object
                required: [data, total]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WaitlistApplicant'
                  total:
                    type: integer
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden — caller is not the league commissioner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: League not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags: [Discovery]
      operationId: joinLeagueWaitlist
      summary: Join the waitlist for a league (authenticated)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicantSeatPreferenceInput'
      responses:
        '201':
          description: Waitlist entry created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistEntry'
        '200':
          description: Already on the waitlist — returns existing entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistEntry'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: League not found or not recruiting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Waitlist not accepting entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /leagues/{leagueId}/waitlist/{userId}/position:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
      - name: userId
        in: path
        required: true
        schema:
          type: string
    patch:
      tags: [Discovery]
      operationId: reorderWaitlistEntry
      summary: Move a waitlist entry to a new position (commissioner only)
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaitlistPositionInput'
      responses:
        '200':
          description: Entry repositioned. Returns the new position.
          content:
            application/json:
              schema:
                type: object
                required: [league_id, user_id, position]
                properties:
                  league_id:
                    type: string
                  user_id:
                    type: string
                  position:
                    type: integer
        '400':
          description: Invalid position value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden — caller is not the league commissioner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: League or waitlist entry not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  # ------------------------------------------------------------------ Feedback

  /feature-requests:
    post:
      tags: [Feedback]
      operationId: createFeatureRequest
      summary: Submit a feature idea (no auth required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureRequestInput'
      responses:
        '201':
          description: Feature request received.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureRequestReceipt'
        '400':
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  # ------------------------------------------------------------------ Leagues

  /leagues:
    post:
      tags: [Leagues]
      operationId: createLeague
      summary: Create a new league
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLeagueInput'
      responses:
        '201':
          description: League created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/League'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Slug already taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /leagues/me:
    get:
      tags: [Leagues]
      operationId: getMyLeagues
      summary: List leagues the current user belongs to
      responses:
        '200':
          description: Leagues the current user is a member of.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/League'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /leagues/{leagueId}:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
    get:
      tags: [Leagues]
      operationId: getLeague
      summary: Get a league
      responses:
        '200':
          description: League found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/League'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      tags: [Leagues]
      operationId: updateLeague
      summary: Update league presentation metadata (commissioner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLeagueInput'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/League'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /leagues/{leagueId}/settings:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
    get:
      tags: [Leagues]
      operationId: getLeagueSettings
      summary: Get the active immutable settings version (league members)
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Active settings version, or a null data result when none exists yet.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LeagueSettingsVersion'
                  - $ref: '#/components/schemas/NoLeagueSettings'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Caller is not an active league member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: League or settings not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /league-settings/templates:
    get:
      tags: [Leagues]
      operationId: listLeagueSettingsTemplates
      summary: List curated starting templates for the league Settings Sheet
      responses:
        '200':
          description: Stable curated templates and their complete settings mappings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueSettingsTemplateList'
  /leagues/{leagueId}/settings/versions:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
    post:
      tags: [Leagues]
      operationId: createLeagueSettingsVersion
      summary: Append and activate a new settings version (commissioner only)
      description: Existing settings versions are never updated or deleted.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeagueSettingsInput'
      responses:
        '201':
          description: New immutable settings version created and activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueSettingsVersion'
        '400':
          description: Invalid settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Caller is not the commissioner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Settings conflict with active season occupancy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /leagues/{leagueId}/settings/history:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
    get:
      tags: [Leagues]
      operationId: listLeagueSettingsHistory
      summary: List immutable settings history newest first (league members)
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Settings history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueSettingsHistory'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Caller is not an active league member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /leagues/{leagueId}/hub:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
    get:
      tags: [Leagues]
      operationId: getLeagueHub
      summary: Hub summary — games on time, open seats, active season stats
      responses:
        '200':
          description: Hub summary data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueHub'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /leagues/{leagueId}/transactions:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
    get:
      tags: [Transactions]
      operationId: listLeagueTransactions
      summary: List the newest ledger entries for a league
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Render-ready ledger entries, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionList' }
        '401': { description: Not authenticated. }
        '403': { description: Not a league member. }
        '404': { description: League not found. }
    post:
      tags: [Transactions]
      operationId: createLeagueTransaction
      summary: Propose an append-only roster or trade transaction
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTransactionInput' }
      responses:
        '201':
          description: Transaction proposed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { description: Invalid transaction or asset combination. }
        '403': { description: Caller cannot propose this transaction. }
        '404': { description: "League, season, team, or player not found." }
        '409': { description: Transaction conflicts with current ledger state. }

  /transactions/{transactionId}/accept:
    parameters:
      - $ref: '#/components/parameters/TransactionId'
    post:
      tags: [Transactions]
      operationId: acceptTransaction
      summary: Counterparty accepts a proposed transaction
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '201': { description: Acceptance appended, content: { application/json: { schema: { $ref: '#/components/schemas/Transaction' } } } }
        '400': { description: Transaction is not awaiting counterparty acceptance. }
        '403': { description: Caller is not the counterparty GM. }
        '404': { description: Transaction not found. }
        '409': { description: Transaction has already progressed. }

  /transactions/{transactionId}/approve:
    parameters:
      - $ref: '#/components/parameters/TransactionId'
    post:
      tags: [Transactions]
      operationId: approveTransaction
      summary: Commissioner approves an accepted transaction
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '201': { description: Approval appended, content: { application/json: { schema: { $ref: '#/components/schemas/Transaction' } } } }
        '400': { description: Transaction is not awaiting approval. }
        '403': { description: Commissioner access required. }
        '404': { description: Transaction not found. }
        '409': { description: Transaction has already progressed. }

  /transactions/{transactionId}/reject:
    parameters:
      - $ref: '#/components/parameters/TransactionId'
    post:
      tags: [Transactions]
      operationId: rejectTransaction
      summary: Commissioner rejects a transaction
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionRationaleInput' }
      responses:
        '201': { description: Rejection appended, content: { application/json: { schema: { $ref: '#/components/schemas/Transaction' } } } }
        '403': { description: Commissioner access required. }
        '404': { description: Transaction not found. }
        '409': { description: Transaction has already progressed. }

  /transactions/{transactionId}/execute:
    parameters:
      - $ref: '#/components/parameters/TransactionId'
    post:
      tags: [Transactions]
      operationId: executeTransaction
      summary: Commissioner executes an approved transaction
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '201': { description: Execution appended, content: { application/json: { schema: { $ref: '#/components/schemas/Transaction' } } } }
        '400': { description: Transaction is not approved. }
        '403': { description: Commissioner access required. }
        '404': { description: Transaction not found. }
        '409': { description: Transaction has already progressed. }

  /transactions/{transactionId}/reverse:
    parameters:
      - $ref: '#/components/parameters/TransactionId'
    post:
      tags: [Transactions]
      operationId: reverseTransaction
      summary: Append a reversal ledger entry for an executed transaction
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionRationaleInput' }
      responses:
        '201': { description: Reversal appended, content: { application/json: { schema: { $ref: '#/components/schemas/Transaction' } } } }
        '400': { description: Only an executed transaction can be reversed. }
        '403': { description: Commissioner access required. }
        '404': { description: Transaction not found. }
        '409': { description: Transaction is already reversed. }

  /leagues/{leagueId}/listing:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
    get:
      tags: [Discovery]
      operationId: getLeagueListing
      summary: Get league listing / discovery settings (commissioner only)
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Listing settings for this league.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueListing'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden — caller is not the league commissioner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: League not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      tags: [Discovery]
      operationId: updateLeagueListing
      summary: Update league listing / discovery settings (commissioner only)
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLeagueListingInput'
      responses:
        '200':
          description: Updated listing settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueListing'
        '400':
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden — caller is not the league commissioner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: League not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /leagues/{leagueId}/signups:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
    get:
      tags: [Discovery]
      operationId: listLeagueSignups
      summary: List sign-up applicants for a league (commissioner only)
      parameters:
        - name: seat
          in: query
          description: Return only applicants willing to take this team-season seat.
          schema:
            type: string
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Sign-up applicants ordered by created_at ASC.
          content:
            application/json:
              schema:
                type: object
                required: [data, total]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LeagueApplicant'
                  total:
                    type: integer
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden — caller is not the league commissioner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: League not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /leagues/{leagueId}/signups/{signupId}/accept:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
      - name: signupId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Discovery]
      operationId: acceptApplicant
      summary: Accept a sign-up applicant (commissioner only)
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Applicant accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicantActionResult'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden — caller is not the league commissioner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Sign-up not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /leagues/{leagueId}/signups/{signupId}/decline:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
      - name: signupId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Discovery]
      operationId: declineApplicant
      summary: Decline a sign-up applicant (commissioner only)
      security:
        - sessionCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclineApplicantInput'
      responses:
        '200':
          description: Applicant declined.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicantActionResult'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden — caller is not the league commissioner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Sign-up not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /l/{slug}:
    parameters:
