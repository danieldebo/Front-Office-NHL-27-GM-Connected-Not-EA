          type: string
          enum: [accepted, declined]

    # ------------------------------------------------------------------ Feedback

    FeatureRequestInput:
      type: object
      required: [body]
      properties:
        email:
          type: string
          maxLength: 254
        body:
          type: string
          minLength: 1
          maxLength: 4000

    FeatureRequestReceipt:
      type: object
      required: [id, created_at]
      properties:
        id:
          type: string
