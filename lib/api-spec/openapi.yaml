    get:
      tags: [Leagues]
      operationId: listSeasons
      summary: List seasons for a league
      responses:
        '200':
          description: Seasons ordered oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Season'
        '404':
          description: Not found.
          content:
            application/json:
