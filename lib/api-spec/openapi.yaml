openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.3.0
  description: Front Office API — league management, results, standings, and scheduling.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Leagues
    description: League and season metadata.
  - name: Seats
    description: Seat management — invites, join requests, GM assignment.
  - name: Rulebook
    description: Versioned league bylaws.
  - name: Competition
    description: Schedule, results, and derived standings.
  - name: Schedule
    description: Season schedule generation and week-window management.
  - name: Availability
    description: Per-GM availability grids and overlap surfacing.
  - name: Discovery
    description: Open-league directory, sign-up, and waitlist intake.
  - name: Feedback
    description: Feature request inbox.
  - name: Users
    description: Authenticated player profile.

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users/me:
    get:
      tags: [Users]
      operationId: getMyProfile
      summary: Get the authenticated player's saved profile
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current player profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      tags: [Users]
      operationId: updateMyProfile
      summary: Update the authenticated player's saved profile
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdate'
      responses:
        '200':
          description: Updated player profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Invalid or inconsistent profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  # ------------------------------------------------------------------ Discovery

  /leagues/open:
    get:
      tags: [Discovery]
      operationId: listOpenLeagues
      summary: Public list of recruiting leagues (no auth required)
      parameters:
        - name: platform
          in: query
          schema:
            type: string
            enum: [psn, xbox, both]
        - name: competitiveness
          in: query
          schema:
            type: string
            enum: [casual, competitive, hardcore]
        - name: seats_open
          in: query
          schema:
            type: string
            enum: ["true", "false"]
        - name: health_min
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Open leagues with seat and waitlist counts.
          content:
            application/json:
              schema:
                type: object
                required: [data, total]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OpenLeague'
                  total:
                    type: integer

  /leagues/{leagueId}/signup:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
    post:
      tags: [Discovery]
      operationId: signupForLeague
      summary: Sign up for an open seat (authenticated)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeagueSignupInput'
      responses:
        '201':
          description: Sign-up created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueSignup'
        '400':
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: League not found or not recruiting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Already signed up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /leagues/{leagueId}/waitlist:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
    get:
      tags: [Discovery]
      operationId: listLeagueWaitlist
      summary: List waitlist entries for a league (commissioner only)
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Waitlist entries ordered by position.
          content:
            application/json:
              schema:
                type: object
                required: [data, total]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WaitlistApplicant'
                  total:
                    type: integer
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden — caller is not the league commissioner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: League not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags: [Discovery]
      operationId: joinLeagueWaitlist
      summary: Join the waitlist for a league (authenticated)
      responses:
        '201':
          description: Waitlist entry created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistEntry'
        '200':
          description: Already on the waitlist — returns existing entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistEntry'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: League not found or not recruiting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Waitlist not accepting entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /leagues/{leagueId}/waitlist/{userId}/position:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
      - name: userId
        in: path
        required: true
        schema:
          type: string
    patch:
      tags: [Discovery]
      operationId: reorderWaitlistEntry
      summary: Move a waitlist entry to a new position (commissioner only)
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaitlistPositionInput'
      responses:
        '200':
          description: Entry repositioned. Returns the new position.
          content:
            application/json:
              schema:
                type: object
                required: [league_id, user_id, position]
                properties:
                  league_id:
                    type: string
                  user_id:
                    type: string
                  position:
                    type: integer
        '400':
          description: Invalid position value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden — caller is not the league commissioner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: League or waitlist entry not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  # ------------------------------------------------------------------ Feedback

  /feature-requests:
    post:
      tags: [Feedback]
      operationId: createFeatureRequest
      summary: Submit a feature idea (no auth required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureRequestInput'
      responses:
        '201':
          description: Feature request received.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureRequestReceipt'
        '400':
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  # ------------------------------------------------------------------ Leagues

  /leagues:
    post:
      tags: [Leagues]
      operationId: createLeague
      summary: Create a new league
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLeagueInput'
      responses:
        '201':
          description: League created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/League'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Slug already taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /leagues/me:
    get:
      tags: [Leagues]
      operationId: getMyLeagues
      summary: List leagues the current user belongs to
      responses:
        '200':
          description: Leagues the current user is a member of.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/League'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /leagues/{leagueId}:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
    get:
      tags: [Leagues]
      operationId: getLeague
      summary: Get a league
      responses:
        '200':
          description: League found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/League'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      tags: [Leagues]
      operationId: updateLeague
      summary: Update league presentation metadata (commissioner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLeagueInput'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/League'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /leagues/{leagueId}/settings:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
    get:
      tags: [Leagues]
      operationId: getLeagueSettings
      summary: Get the active immutable settings version (league members)
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Active settings version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueSettingsVersion'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Caller is not an active league member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: League or settings not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /leagues/{leagueId}/settings/versions:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
    post:
      tags: [Leagues]
      operationId: createLeagueSettingsVersion
      summary: Append and activate a new settings version (commissioner only)
      description: Existing settings versions are never updated or deleted.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeagueSettingsInput'
      responses:
        '201':
          description: New immutable settings version created and activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueSettingsVersion'
        '400':
          description: Invalid settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Caller is not the commissioner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Settings conflict with active season occupancy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /leagues/{leagueId}/settings/history:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
    get:
      tags: [Leagues]
      operationId: listLeagueSettingsHistory
      summary: List immutable settings history newest first (league members)
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Settings history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueSettingsHistory'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Caller is not an active league member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /leagues/{leagueId}/hub:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
    get:
      tags: [Leagues]
      operationId: getLeagueHub
      summary: Hub summary — games on time, open seats, active season stats
      responses:
        '200':
          description: Hub summary data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueHub'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /leagues/{leagueId}/listing:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
    get:
      tags: [Discovery]
      operationId: getLeagueListing
      summary: Get league listing / discovery settings (commissioner only)
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Listing settings for this league.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueListing'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden — caller is not the league commissioner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: League not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    put:
      tags: [Discovery]
      operationId: updateLeagueListing
      summary: Update league listing / discovery settings (commissioner only)
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLeagueListingInput'
      responses:
        '200':
          description: Updated listing settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueListing'
        '400':
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden — caller is not the league commissioner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: League not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /leagues/{leagueId}/signups:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
    get:
      tags: [Discovery]
      operationId: listLeagueSignups
      summary: List sign-up applicants for a league (commissioner only)
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Sign-up applicants ordered by created_at ASC.
          content:
            application/json:
              schema:
                type: object
                required: [data, total]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LeagueApplicant'
                  total:
                    type: integer
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden — caller is not the league commissioner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: League not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /leagues/{leagueId}/signups/{signupId}/accept:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
      - name: signupId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Discovery]
      operationId: acceptApplicant
      summary: Accept a sign-up applicant (commissioner only)
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Applicant accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicantActionResult'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden — caller is not the league commissioner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Sign-up not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /leagues/{leagueId}/signups/{signupId}/decline:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
      - name: signupId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Discovery]
      operationId: declineApplicant
      summary: Decline a sign-up applicant (commissioner only)
      security:
        - sessionCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclineApplicantInput'
      responses:
        '200':
          description: Applicant declined.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicantActionResult'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden — caller is not the league commissioner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Sign-up not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /l/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: League URL slug
    get:
      tags: [Leagues]
      operationId: getPublicLeague
      summary: Public league page — standings visible without authentication
      responses:
        '200':
          description: League + active season standings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicLeagueEnvelope'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /leagues/{leagueId}/seasons:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
    get:
      tags: [Leagues]
      operationId: listSeasons
      summary: List seasons for a league
      responses:
        '200':
          description: Seasons ordered oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Season'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags: [Leagues]
      operationId: createSeason
      summary: Create a new season and provision the configured number of franchise seats (commissioner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSeasonInput'
      responses:
        '201':
          description: Season created with seats from the active league settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Season'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  # ------------------------------------------------------------------ Seats

  /leagues/{leagueId}/invites:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
    get:
      tags: [Seats]
      operationId: listInvites
      summary: List active invite links (commissioner only)
      responses:
        '200':
          description: Active invite links.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/InviteLink'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags: [Seats]
      operationId: createInvite
      summary: Generate an invite link (commissioner only)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteInput'
      responses:
        '201':
          description: Invite link created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteLink'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /invites/{token}:
    parameters:
      - $ref: '#/components/parameters/InviteToken'
    get:
      tags: [Seats]
      operationId: getInvite
      summary: Preview an invite link before joining
      responses:
        '200':
          description: Invite details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteLink'
        '404':
          description: Not found or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags: [Seats]
      operationId: revokeInvite
      summary: Revoke an invite link (commissioner only)
      responses:
        '204':
          description: Revoked.
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /invites/{token}/join:
    parameters:
      - $ref: '#/components/parameters/InviteToken'
    post:
      tags: [Seats]
      operationId: joinViaInvite
      summary: Submit a join request via invite link
      responses:
        '201':
          description: Join request created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequest'
        '200':
          description: Already requested — returns existing request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequest'
        '400':
          description: Invite expired or exhausted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Invite not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /leagues/{leagueId}/join-requests:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
    get:
      tags: [Seats]
      operationId: listJoinRequests
      summary: List join requests for a league (commissioner only)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        '200':
          description: Join requests.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/JoinRequest'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /leagues/{leagueId}/join-requests/{requestId}/approve:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
      - $ref: '#/components/parameters/JoinRequestId'
    post:
      tags: [Seats]
      operationId: approveJoinRequest
      summary: Approve a join request and add the user to the league (commissioner only)
      responses:
        '200':
          description: Approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequest'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Already reviewed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /leagues/{leagueId}/join-requests/{requestId}/reject:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
      - $ref: '#/components/parameters/JoinRequestId'
    post:
      tags: [Seats]
      operationId: rejectJoinRequest
      summary: Reject a join request (commissioner only)
      responses:
        '200':
          description: Rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequest'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /leagues/{leagueId}/seats:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
    get:
      tags: [Seats]
      operationId: listSeats
      summary: List all franchise seats in the active season
      responses:
        '200':
          description: All seats with current GM info.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Seat'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /leagues/{leagueId}/members/unassigned:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
    get:
      tags: [Seats]
      operationId: listUnassignedMembers
      summary: List league members with no active franchise seat (commissioner only)
      description: |
        Feeds the "Assign GM" picker so the commissioner chooses a member
        from a list instead of pasting a user id.
      responses:
        '200':
          description: Members eligible to be assigned a seat.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UnassignedMember'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: League not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /team-seasons/{teamSeasonId}/gm:
    parameters:
      - $ref: '#/components/parameters/TeamSeasonId'
    put:
      tags: [Seats]
      operationId: assignGm
      summary: Assign a GM to a franchise seat (commissioner only)
      description: |
        Closes the current active gm_assignment (if any) and opens a new one.
        The franchise record is untouched — only the assignment changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignGmInput'
      responses:
        '200':
          description: GM assigned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Seat'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Team season or user not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags: [Seats]
      operationId: revokeGm
      summary: Remove the current GM from a seat (commissioner only)
      parameters:
        - name: reason
          in: query
          schema:
            type: string
      responses:
        '200':
          description: GM removed — seat is now open.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Seat'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  # ------------------------------------------------------------------ Rulebook

  /leagues/{leagueId}/rulebook:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
    get:
      tags: [Rulebook]
      operationId: getLatestRulebook
      summary: Get the current rulebook revision
      responses:
        '200':
          description: Latest revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulebookRevision'
        '404':
          description: No rulebook yet or league not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    put:
      tags: [Rulebook]
      operationId: publishRulebook
      summary: Publish a new rulebook revision (commissioner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRulebookInput'
      responses:
        '201':
          description: New revision created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulebookRevision'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: League not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /leagues/{leagueId}/rulebook/revisions:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
    get:
      tags: [Rulebook]
      operationId: listRulebookRevisions
      summary: List all rulebook revisions in reverse-chronological order
      responses:
        '200':
          description: All revisions.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RulebookRevision'
        '404':
          description: League not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  # ------------------------------------------------------------------ Competition

  /seasons/{seasonId}/standings:
    parameters:
      - $ref: '#/components/parameters/SeasonId'
    get:
      tags: [Competition]
      operationId: getStandings
      summary: Get standings for a season
      description: |
        Computed from confirmed results on every request. There is no write
        path for this resource — correcting a result corrects the table automatically.
      responses:
        '200':
          description: Standings sorted by the season's configured tiebreakers.
          content:
            application/json:
              schema:
                type: object
                required: [data, computed_at]
                properties:
                  computed_at:
                    type: string
                    format: date-time
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StandingsRow'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /seasons/{seasonId}/games:
    parameters:
      - $ref: '#/components/parameters/SeasonId'
    get:
      tags: [Competition]
      operationId: listGames
      summary: List games for a season
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/GameStatus'
        - name: week
          in: query
          schema:
            type: integer
            minimum: 1
        - name: franchise_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: A page of games.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Game'
                  next_cursor:
                    type: ["string", "null"]
                  has_more:
                    type: boolean
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /games/{gameId}/results:
    parameters:
      - $ref: '#/components/parameters/GameId'
    post:
      tags: [Competition]
      operationId: reportResult
      summary: Report a result for a game
      description: |
        Reports a final score. The result is not counted toward standings until
        the opposing GM confirms it. Append-only — a correction supersedes the
        previous result and must carry a supersede_reason.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResultInput'
      responses:
        '201':
          description: Result recorded, awaiting confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameResult'
        '200':
          description: Idempotent replay. The original result is returned unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameResult'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Unprocessable entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /results/{resultId}/confirm:
    parameters:
      - $ref: '#/components/parameters/ResultId'
    post:
      tags: [Competition]
      operationId: confirmResult
      summary: Confirm or dispute a reported result
      description: |
        Confirmation must come from a different user than the reporter. Self-confirmation
        is rejected. Supply the If-Match header with the result's version to prevent
        racing GMs from silently overwriting each other.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmInput'
      responses:
        '200':
          description: Result confirmed or disputed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameResult'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Version mismatch — re-read and retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  # ------------------------------------------------------------------ Schedule

  /seasons/{seasonId}/schedule:
    post:
      tags: [Schedule]
      operationId: generateSchedule
      summary: Generate a balanced round-robin schedule for a season
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateScheduleBody'
      responses:
        '201':
          description: Schedule created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateScheduleResult'
        '409':
          description: Schedule already exists for this season.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /seasons/{seasonId}/weeks:
    get:
      tags: [Schedule]
      operationId: listWeeks
      summary: List week windows with game status counts
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Week window list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeekListEnvelope'

  /games/{gameId}/window:
    patch:
      tags: [Schedule]
      operationId: shiftWindow
      summary: Shift a game's scheduling window (commissioner)
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftWindowBody'
      responses:
        '200':
          description: Window updated.

  /games/{gameId}/postpone:
    post:
      tags: [Schedule]
      operationId: postponeGame
      summary: Postpone a game (commissioner)
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostponeGameBody'
      responses:
        '200':
          description: Game postponed.

  /games/{gameId}/force-resolve:
    post:
      tags: [Schedule]
      operationId: forceResolveGame
      summary: Force-resolve a game at window close (commissioner)
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForceResolveGameBody'
      responses:
        '200':
          description: Game force-resolved.

  # ------------------------------------------------------------------ Commissioner Links

  /leagues/{leagueId}/commissioner-invite:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
    get:
      tags: [Leagues]
      operationId: getCommissionerInvite
      summary: Get the active commissioner invite and public code (commissioner only)
      responses:
        '200':
          description: Active commissioner invite and public code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionerInviteEnvelope'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags: [Leagues]
      operationId: createCommissionerInvite
      summary: Create the first commissioner invite link (commissioner only)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommissionerInviteInput'
      responses:
        '201':
          description: Invite created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionerInvite'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: An active invite already exists — rotate instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      tags: [Leagues]
      operationId: updateCommissionerInvite
      summary: Update max_uses / expires_at on the active commissioner invite (commissioner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommissionerInviteInput'
      responses:
        '200':
          description: Updated invite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionerInvite'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No active invite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags: [Leagues]
      operationId: revokeCommissionerInvite
      summary: Revoke the active commissioner invite (commissioner only)
      responses:
        '204':
          description: Revoked.
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No active invite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /leagues/{leagueId}/commissioner-invite/rotate:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
    post:
      tags: [Leagues]
      operationId: rotateCommissionerInvite
      summary: Rotate the commissioner invite — revoke old, issue new (commissioner only)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommissionerInviteInput'
      responses:
        '200':
          description: New invite issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionerInvite'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /leagues/{leagueId}/public-code:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
    patch:
      tags: [Leagues]
      operationId: setPublicCode
      summary: Set or update the league public code (commissioner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPublicCodeInput'
      responses:
        '200':
          description: Public code updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCodeResult'
        '400':
          description: Invalid format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Public code already taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /j/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
        description: League public code (case-insensitive, e.g. RUSTBELT)
    get:
      tags: [Discovery]
      operationId: resolvePublicCode
      summary: Resolve a league public code to its slug (no auth required)
      responses:
        '200':
          description: League slug resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCodeLookup'
        '404':
          description: No league with that public code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /join/{token}:
    parameters:
      - $ref: '#/components/parameters/CommissionerInviteToken'
    get:
      tags: [Seats]
      operationId: getCommissionerInvitePublic
      summary: Public landing page data for a commissioner invite link
      responses:
        '200':
          description: Invite info and usability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionerInvitePublic'
        '410':
          description: Invite no longer active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /join/{token}/claim:
    parameters:
      - $ref: '#/components/parameters/CommissionerInviteToken'
    post:
      tags: [Seats]
      operationId: claimCommissionerInvite
      summary: Claim a seat via commissioner invite (authenticated)
      responses:
        '200':
          description: Claim recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimOutcome'
        '409':
          description: Already claimed this invite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: Invite no longer active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  # ------------------------------------------------------------------ Availability

  /leagues/{leagueId}/availability:
    put:
      tags: [Availability]
      operationId: setAvailability
      summary: Set my availability grid for a league
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAvailabilityBody'
      responses:
        '200':
          description: Availability saved.

  /leagues/{leagueId}/availability/me:
    get:
      tags: [Availability]
      operationId: getMyAvailability
      summary: Get my availability grid for a league
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Availability record.

  /games/{gameId}/overlap:
    get:
      tags: [Availability]
      operationId: getGameOverlap
      summary: Get overlapping availability for a game's two GMs
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Overlap computation result.

  /leagues/{leagueId}/dq-findings:
    get:
      operationId: listDqFindings
      summary: List data-quality findings for a league (commissioner only)
      tags: [DQ]
      parameters:
        - $ref: '#/components/parameters/LeagueId'
        - name: severity
          in: query
          required: false
          schema:
            type: string
            enum: [BLOCK, ALERT, WATCH]
        - name: resolved
          in: query
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Paginated list of DQ findings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DqFindingsEnvelope'
        '403':
          description: Not the league commissioner.
        '404':
          description: League not found.

  /leagues/{leagueId}/dq-findings/{findingId}/resolve:
    patch:
      operationId: resolveDqFinding
      summary: Mark a DQ finding as resolved (commissioner only)
      tags: [DQ]
      parameters:
        - $ref: '#/components/parameters/LeagueId'
        - name: findingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Finding marked resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DqFinding'
        '403':
          description: Not the league commissioner.
        '404':
          description: Finding not found.

components:

  parameters:
    LeagueId:
      name: leagueId
      in: path
      required: true
      schema:
        type: string
    SeasonId:
      name: seasonId
      in: path
      required: true
      schema:
        type: string
    GameId:
      name: gameId
      in: path
      required: true
      schema:
        type: string
    ResultId:
      name: resultId
      in: path
      required: true
      schema:
        type: string
    TeamSeasonId:
      name: teamSeasonId
      in: path
      required: true
      schema:
        type: string
    InviteToken:
      name: token
      in: path
      required: true
      schema:
        type: string
    CommissionerInviteToken:
      name: token
      in: path
      required: true
      schema:
        type: string
    JoinRequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
  schemas:

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, trace_id]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: ["string", "null"]
        instance:
          type: ["string", "null"]
        trace_id:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ProblemError'

    ProblemError:
      type: object
      properties:
        pointer:
          type: string
        message:
          type: string

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    # ------------------------------------------------------------------ Domain

    League:
      type: object
      required: [id, slug, name, visibility]
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        visibility:
          type: string
          enum: [public, unlisted, private]
        logo_url:
          type: ["string", "null"]
        primary_color:
          type: ["string", "null"]
        secondary_color:
          type: ["string", "null"]
        owner_user_id:
          type: string
        created_at:
          type: string
          format: date-time

    CreateLeagueInput:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          minLength: 2
          maxLength: 40
          pattern: '^[a-z0-9][a-z0-9-]*[a-z0-9]$'
        visibility:
          type: string
          enum: [public, unlisted, private]
          default: public
        primary_color:
          type: ["string", "null"]
        secondary_color:
          type: ["string", "null"]
        logo_url:
          type: ["string", "null"]

    UpdateLeagueInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        visibility:
          type: string
          enum: [public, unlisted, private]
        primary_color:
          type: ["string", "null"]
        secondary_color:
          type: ["string", "null"]
        logo_url:
          type: ["string", "null"]

    LeagueSettingsInput:
      type: object
      additionalProperties: false
      required:
        - platform
        - team_count
        - roster_source
        - schedule_format
        - schedule_settings
        - playoff_format
        - divisions
        - conferences
        - slider_presets
        - change_summary
      properties:
        ea_league_id:
          type: ["string", "null"]
          maxLength: 100
        platform:
          type: string
          enum: [psn, xbox, both]
        team_count:
          type: integer
          minimum: 3
          maximum: 32
        roster_source:
          type: string
          enum: [manual, ea, csv_import]
        schedule_format:
          type: string
          enum: [round_robin, double_round_robin, custom]
        schedule_settings:
          type: object
          additionalProperties: true
        playoff_format:
          type: object
          additionalProperties: true
        salary_cap_cents:
          type: ["integer", "null"]
          minimum: 0
        roster_min:
          type: ["integer", "null"]
          minimum: 1
        roster_max:
          type: ["integer", "null"]
          minimum: 1
        divisions:
          type: array
          items:
            type: string
        conferences:
          type: array
          items:
            type: string
        rules_notes:
          type: ["string", "null"]
        slider_presets:
          type: object
          additionalProperties: true
        change_summary:
          type: string
          minLength: 1
          maxLength: 500

    LeagueSettingsVersion:
      allOf:
        - $ref: '#/components/schemas/LeagueSettingsInput'
        - type: object
          required: [id, league_id, version, changed_by, changed_at, is_active, can_manage]
          properties:
            id:
              type: string
            league_id:
              type: string
            version:
              type: integer
            changed_by:
              type: string
            changed_at:
              type: string
              format: date-time
            is_active:
              type: boolean
            can_manage:
              type: boolean

    LeagueSettingsHistory:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LeagueSettingsVersion'

    CreateSeasonInput:
      type: object
      required: [label, game_title]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
        game_title:
          type: string
          minLength: 1
          maxLength: 50
        starts_on:
          type: ["string", "null"]
          format: date
        ends_on:
          type: ["string", "null"]
          format: date
        salary_cap_cents:
          type: ["integer", "null"]
          minimum: 0
        roster_min:
          type: ["integer", "null"]
          minimum: 1
        roster_max:
          type: ["integer", "null"]
          minimum: 1
        games_per_matchup:
          type: integer
          minimum: 1
          default: 1
        points_win:
          type: integer
          minimum: 0
          default: 2
        points_ot_loss:
          type: integer
          minimum: 0
          default: 1
        points_reg_loss:
          type: integer
          minimum: 0
          default: 0
        tiebreakers:
          type: array
          items:
            type: string
          default: ["points", "row", "wins", "goal_diff", "goals_for"]

    LeagueHub:
      type: object
      description: Summary stats for the league hub slab.
      required: [league_id, active_season_id]
      properties:
        league_id:
          type: string
        active_season_id:
          type: ["string", "null"]
        active_season_label:
          type: ["string", "null"]
        games_scheduled:
          type: integer
        games_confirmed:
          type: integer
        games_on_time_pct:
          type: ["number", "null"]
        open_seats:
          type: integer
        active_gms:
          type: integer
        my_games_this_week:
          type: array
          items:
            $ref: '#/components/schemas/Game'

    PublicLeagueEnvelope:
      type: object
      required: [league, standings]
      properties:
        league:
          type: object
          required: [id, slug, name, visibility]
          properties:
            id:
              type: string
            slug:
              type: string
            name:
              type: string
            visibility:
              type: string
            public_code:
              type: string
              nullable: true
        season:
          oneOf:
            - type: object
              required: [id, label]
              properties:
                id:
                  type: string
                label:
                  type: string
            - type: 'null'
        standings:
          type: array
          items:
            $ref: '#/components/schemas/StandingsRow'
        listing:
          description: >
            Present when the league has an active listing entry (is_listed = true).
            Null when the league is not publicly recruiting.
          oneOf:
            - type: object
              required: [is_listed, accepting_signups, accepting_waitlist]
              properties:
                is_listed:
                  type: boolean
                accepting_signups:
                  type: boolean
                accepting_waitlist:
                  type: boolean
                blurb:
                  type: ["string", "null"]
                platform:
                  type: ["string", "null"]
                competitiveness:
                  type: ["string", "null"]
                suggested_division:
                  type: ["string", "null"]
            - type: 'null'

    Season:
      type: object
      required: [id, ordinal, label, game_title]
      properties:
        id:
          type: string
        league_id:
          type: string
        settings_version_id:
          type: ["string", "null"]
          description: Immutable league settings version bound to this season.
        ordinal:
          type: integer
          minimum: 1
        label:
          type: string
        game_title:
          type: string
        starts_on:
          type: ["string", "null"]
        ends_on:
          type: ["string", "null"]
        salary_cap_cents:
          type: ["integer", "null"]
        roster_min:
          type: ["integer", "null"]
        roster_max:
          type: ["integer", "null"]
        games_per_matchup:
          type: integer
        points_win:
          type: integer
        points_ot_loss:
          type: integer
        points_reg_loss:
          type: integer
        tiebreakers:
          type: array
          items:
            type: string
        is_active:
          type: boolean

    # ------------------------------------------------------------------ Seats

    InviteLink:
      type: object
      required: [id, token, league_id, created_at]
      properties:
        id:
          type: string
        token:
          type: string
        league_id:
          type: string
        max_uses:
          type: ["integer", "null"]
        use_count:
          type: integer
        expires_at:
          type: ["string", "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: ["string", "null"]
          format: date-time
        league_name:
          type: ["string", "null"]

    CreateInviteInput:
      type: object
      properties:
        max_uses:
          type: ["integer", "null"]
          minimum: 1
        expires_in_hours:
          type: ["integer", "null"]
          minimum: 1

    JoinRequest:
      type: object
      required: [id, league_id, status, created_at]
      properties:
        id:
          type: string
        league_id:
          type: string
        user_id:
          type: string
        display_name:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, approved, rejected]
        reviewed_by:
          type: ["string", "null"]
        reviewed_at:
          type: ["string", "null"]
          format: date-time
        note:
          type: ["string", "null"]
        created_at:
          type: string
          format: date-time

    Seat:
      type: object
      required: [team_season_id, franchise_id, seat_status]
      properties:
        team_season_id:
          type: string
        franchise_id:
          type: string
        franchise_name:
          type: string
        nhl_club_id:
          type: ["string", "null"]
        club_abbrev:
          type: ["string", "null"]
        club_name:
          type: ["string", "null"]
        conference:
          type: ["string", "null"]
        division:
          type: ["string", "null"]
        seat_status:
          type: string
          enum: [open, pending, filled, suspended, vacated]
        gm:
          oneOf:
            - $ref: '#/components/schemas/AssignedGm'
            - type: 'null'

    AssignedGm:
      type: object
      required: [assignment_id, user_id]
      properties:
        assignment_id:
          type: string
        user_id:
          type: string
        display_name:
          type: ["string", "null"]
        gm_platform:
          oneOf:
            - $ref: '#/components/schemas/PlayerSystem'
            - type: 'null'
        gm_primary_identity:
          oneOf:
            - $ref: '#/components/schemas/PlayerSystem'
            - type: 'null'
        gm_gamertag:
          type: ["string", "null"]
        gm_xbox_gamertag:
          type: ["string", "null"]
        gm_psn_online_id:
          type: ["string", "null"]
        started_at:
          type: string
          format: date-time
        role:
          type: string

    UnassignedMember:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
        display_name:
          type: ["string", "null"]
        identity:
          type: object
          properties:
            gm_display_name:
              type: ["string", "null"]
            gm_platform:
              oneOf:
                - $ref: '#/components/schemas/PlayerSystem'
                - type: 'null'
            gm_primary_identity:
              oneOf:
                - $ref: '#/components/schemas/PlayerSystem'
                - type: 'null'
            gm_gamertag:
              type: ["string", "null"]
            gm_xbox_gamertag:
              type: ["string", "null"]
            gm_psn_online_id:
              type: ["string", "null"]

    AssignGmInput:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
        role:
          type: string
          enum: [gm, assistant_commissioner]
          default: gm
        end_reason:
          type: ["string", "null"]
          description: Reason for closing the previous GM assignment (if any).

    # ------------------------------------------------------------------ Rulebook

    RulebookRevision:
      type: object
      required: [id, league_id, version, body_md, authored_by, effective_at]
      properties:
        id:
          type: string
        league_id:
          type: string
        version:
          type: string
        body_md:
          type: string
        change_note:
          type: ["string", "null"]
        authored_by:
          type: string
        effective_at:
          type: string
          format: date-time

    PublishRulebookInput:
      type: object
      required: [body_md]
      properties:
        body_md:
          type: string
          minLength: 1
        change_note:
          type: ["string", "null"]
          maxLength: 500

    # ------------------------------------------------------------------ Competition

    GameStatus:
      type: string
      enum: [scheduled, in_window, reported, confirmed, disputed, forfeited, postponed, simulated, voided]

    GameSide:
      type: object
      required: [team_season_id, franchise_id]
      properties:
        team_season_id:
          type: string
        franchise_id:
          type: string
        franchise_name:
          type: ["string", "null"]
        club_abbrev:
          type: ["string", "null"]
        goals:
          type: ["integer", "null"]
          minimum: 0
        gm_display_name:
          type: ["string", "null"]
        gm_platform:
          oneOf:
            - $ref: '#/components/schemas/PlayerSystem'
            - type: 'null'
        gm_primary_identity:
          oneOf:
            - $ref: '#/components/schemas/PlayerSystem'
            - type: 'null'
        gm_gamertag:
          type: ["string", "null"]
        gm_xbox_gamertag:
          type: ["string", "null"]
        gm_psn_online_id:
          type: ["string", "null"]

    Game:
      type: object
      required: [id, season_id, status, home, away]
      properties:
        id:
          type: string
        season_id:
          type: string
        week_number:
          type: ["integer", "null"]
        status:
          $ref: '#/components/schemas/GameStatus'
        window_opens_at:
          type: string
          format: date-time
        window_closes_at:
          type: string
          format: date-time
        played_at:
          type: ["string", "null"]
          format: date-time
        home:
          $ref: '#/components/schemas/GameSide'
        away:
          $ref: '#/components/schemas/GameSide'
        result:
          oneOf:
            - $ref: '#/components/schemas/GameResult'
            - type: 'null'

    GameResult:
      type: object
      required: [id, game_id, home_goals, away_goals, decision, version, data_source]
      properties:
        id:
          type: string
        game_id:
          type: string
        home_goals:
          type: integer
          minimum: 0
        away_goals:
          type: integer
          minimum: 0
        decision:
          type: string
          enum: [regulation, overtime, shootout]
        version:
          type: integer
          description: |
            Optimistic-concurrency token. Return as ETag; require If-Match on
            confirm/dispute/supersede. A stale value returns 409.
        data_source:
          type: string
          enum: [manual, confirmed, ocr, csv_import, partner_api, system]
        counts_toward_standings:
          type: boolean
        reported_by:
          type: ["string", "null"]
        verified_by:
          type: ["string", "null"]
        verified_at:
          type: ["string", "null"]
          format: date-time
        superseded_by:
          type: ["string", "null"]
        supersede_reason:
          type: ["string", "null"]
        created_at:
          type: string
          format: date-time

    ResultInput:
      type: object
      required: [home_goals, away_goals, decision]
      properties:
        home_goals:
          type: integer
          minimum: 0
        away_goals:
          type: integer
          minimum: 0
        decision:
          type: string
          enum: [regulation, overtime, shootout]
        supersede_result_id:
          type: ["string", "null"]
        supersede_reason:
          type: ["string", "null"]
          maxLength: 500

    ConfirmInput:
      type: object
      required: [agree]
      properties:
        agree:
          type: boolean
        dispute_reason:
          type: ["string", "null"]
          maxLength: 500

    # ------------------------------------------------------------------ Schedule

    GenerateScheduleBody:
      type: object
      properties:
        week_duration_days:
          type: integer
          minimum: 1
          maximum: 30
          default: 7
        start_date:
          type: string
          format: date

    GenerateScheduleResult:
      type: object
      required: [games_created, total_weeks, total_rounds]
      properties:
        games_created:
          type: integer
        total_weeks:
          type: integer
        total_rounds:
          type: integer
        season_start:
          type: string
          format: date-time
        week_duration_days:
          type: integer

    WeekStatus:
      type: object
      required: [total, scheduled, in_window, reported, confirmed, disputed, forfeited, postponed, voided]
      properties:
        total:      { type: integer }
        scheduled:  { type: integer }
        in_window:  { type: integer }
        reported:   { type: integer }
        confirmed:  { type: integer }
        disputed:   { type: integer }
        forfeited:  { type: integer }
        postponed:  { type: integer }
        voided:     { type: integer }

    WeekWindow:
      type: object
      required: [week_number, window_opens_at, window_closes_at, games]
      properties:
        week_number:
          type: integer
        window_opens_at:
          type: string
          format: date-time
        window_closes_at:
          type: string
          format: date-time
        games:
          $ref: '#/components/schemas/WeekStatus'

    WeekListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WeekWindow'

    ShiftWindowBody:
      type: object
      required: [window_opens_at, window_closes_at, reason]
      properties:
        window_opens_at:
          type: string
          format: date-time
        window_closes_at:
          type: string
          format: date-time
        reason:
          type: string
          minLength: 1
          maxLength: 500

    PostponeGameBody:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500

    ForceResolveGameBody:
      type: object
      required: [resolution, reason]
      properties:
        resolution:
          type: string
          enum: [forfeit_home, forfeit_away, void]
        reason:
          type: string
          minLength: 1
          maxLength: 500

    # ------------------------------------------------------------------ Availability

    CommissionerInvite:
      type: object
      required: [id, league_id, token, created_by, uses, is_active, created_at]
      properties:
        id:
          type: string
        league_id:
          type: string
        token:
          type: string
        created_by:
          type: string
        max_uses:
          type: ["integer", "null"]
          minimum: 1
        uses:
          type: integer
          minimum: 0
        expires_at:
          type: ["string", "null"]
          format: date-time
        is_active:
          type: boolean
        revoked_at:
          type: ["string", "null"]
          format: date-time
        created_at:
          type: string
          format: date-time

    CommissionerInviteEnvelope:
      type: object
      required: [public_code, invite]
      properties:
        public_code:
          type: ["string", "null"]
        invite:
          oneOf:
            - $ref: '#/components/schemas/CommissionerInvite'
            - type: 'null'

    CommissionerInviteInput:
      type: object
      properties:
        max_uses:
          type: ["integer", "null"]
          minimum: 1
        expires_at:
          type: ["string", "null"]
          format: date-time

    SetPublicCodeInput:
      type: object
      properties:
        public_code:
          type: ["string", "null"]
          minLength: 5
          maxLength: 12
          pattern: '^[A-Z0-9]{5,12}$'

    PublicCodeResult:
      type: object
      required: [public_code]
      properties:
        public_code:
          type: ["string", "null"]

    PublicCodeLookup:
      type: object
      required: [slug]
      properties:
        slug:
          type: string

    CommissionerInvitePublic:
      type: object
      required: [invite_id, token, league_id, league_name, usable]
      properties:
        invite_id:
          type: string
        token:
          type: string
        league_id:
          type: string
        league_name:
          type: string
        league_slug:
          type: string
        platform:
          type: ["string", "null"]
        usable:
          type: boolean
        reason:
          type: ["string", "null"]
        uses:
          type: integer
        max_uses:
          type: ["integer", "null"]
        expires_at:
          type: ["string", "null"]
          format: date-time

    ClaimOutcome:
      type: object
      required: [outcome, league_id, invite_id]
      properties:
        outcome:
          type: string
          enum: [member, waitlist]
        league_id:
          type: string
        invite_id:
          type: string

    AvailabilitySlot:
      type: object
      required: [dow, block]
      properties:
        dow:
          type: integer
          minimum: 0
          maximum: 6
          description: "0 = Sunday, 6 = Saturday"
        block:
          type: string
          enum: [morning, afternoon, evening, night]

    SetAvailabilityBody:
      type: object
      required: [timezone, slots]
      properties:
        timezone:
          type: string
          minLength: 1
          maxLength: 100
          description: IANA timezone string (e.g. America/New_York)
        slots:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilitySlot'
          maxItems: 56

    # ------------------------------------------------------------------ Discovery

    OpenLeague:
      type: object
      required: [league_id, name, accepting_signups, accepting_waitlist, max_seats, seats_filled, seats_open, waitlist_length]
      properties:
        league_id:
          type: string
        slug:
          type: ["string", "null"]
        name:
          type: string
        logo_url:
          type: ["string", "null"]
        blurb:
          type: ["string", "null"]
        platform:
          type: ["string", "null"]
        competitiveness:
          type: ["string", "null"]
        suggested_division:
          type: ["string", "null"]
        accepting_signups:
          type: boolean
        accepting_waitlist:
          type: boolean
        active_season_id:
          type: ["string", "null"]
        max_seats:
          type: integer
        seats_filled:
          type: integer
        seats_open:
          type: integer
        waitlist_length:
          type: integer
        games_confirmed:
          type: ["integer", "null"]
        active_gms:
          type: ["integer", "null"]

    LeagueSignupInput:
      type: object
      properties:
        country_code:
          type: string
          minLength: 2
          maxLength: 2
          pattern: '^[A-Z]{2}$'
        location:
          type: string
          maxLength: 100
        stated_division:
          type: string
          enum: [bronze, silver, gold, diamond, platinum, elite, ultimate]
        message:
          type: string
          maxLength: 500
        preferred_club:
          type: string
          maxLength: 100

    LeagueSignup:
      type: object
      required: [id, league_id, user_id, created_at]
      properties:
        id:
          type: string
        league_id:
          type: string
        user_id:
          type: string
        platform:
          type: ["string", "null"]
        platform_gamertag:
          type: ["string", "null"]
        timezone:
          type: ["string", "null"]
        country_code:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        stated_division:
          type: ["string", "null"]
        message:
          type: ["string", "null"]
        preferred_club:
          type: ["string", "null"]
        created_at:
          type: string
          format: date-time

    PlayerSystem:
      type: string
      enum: [xbox, playstation]

    UserProfile:
      type: object
      required:
        [id, display_name, timezone, xbox_gamertag, psn_online_id,
         systems_played, primary_identity]
      properties:
        id:
          type: string
        display_name:
          type: string
        timezone:
          type: string
        xbox_gamertag:
          type: ["string", "null"]
        psn_online_id:
          type: ["string", "null"]
        systems_played:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PlayerSystem'
