        accepting_signups:
          type: boolean
        accepting_waitlist:
          type: boolean
        blurb:
          type: ['string', 'null']
        platform:
          type: ['string', 'null']
          description: Canonical values plus legacy aliases accepted during client migration.
          enum: [psn, playstation, xbox, both, crossplay, null]
        competitiveness:
          type: ['string', 'null']
          enum: [casual, competitive, hardcore, null]
        suggested_division:
          type: ['string', 'null']
        timezone_focus:
          type: ['string', 'null']

    LeagueApplicant:
      type: object
      required: [signup_id, league_id, user_id, created_at]
