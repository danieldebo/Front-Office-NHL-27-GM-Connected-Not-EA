  <text x="32" y="34" text-anchor="middle" dominant-baseline="central"
        font-family="Anton, Impact, 'Arial Narrow', sans-serif" font-weight="900"
        font-size="30" letter-spacing="-1" fill="#F2A93B">27</text>
