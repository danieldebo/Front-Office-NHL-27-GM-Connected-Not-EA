<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Front Office</title>
    <meta name="description" content="Front Office — connected-franchise league tools for NHL 27 GM Connected leagues: schedules, standings, transactions, keepers, and commissioner tools." />
    <meta name="robots" content="index, follow" />

    <!--
      Social share card — every route serves this same static index.html, so
      updating the card for the whole site is just replacing these two files:
        public/og-image.png  (1200x630 banner)
        public/favicon.svg   (tab icon; public/favicon-512.png is its PNG fallback)
      Regenerate og-image.png by re-rendering an HTML source of the same
      dimensions (see replit.md, "Brand assets") — no code change needed.
    -->
    <meta property="og:title" content="Front Office" />
    <meta property="og:description" content="Connected-franchise league tools for NHL 27 GM Connected leagues." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gmcfrontoffice.com/" />
    <meta property="og:image" content="https://gmcfrontoffice.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Front Office" />
    <meta name="twitter:description" content="Connected-franchise league tools for NHL 27 GM Connected leagues." />
    <meta name="twitter:image" content="https://gmcfrontoffice.com/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/favicon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
