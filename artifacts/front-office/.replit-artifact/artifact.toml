kind = "web"
previewPath = "/"
title = "Front Office"
version = "1.0.0"
id = "artifacts/front-office"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22166

[services.development]
run = "pnpm --filter @workspace/front-office run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/front-office", "run", "build" ]
serve = "static"
publicDir = "artifacts/front-office/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22166"
BASE_PATH = "/"
